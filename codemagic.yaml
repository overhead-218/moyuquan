# Codemagic 云构建配置（iOS 上线，无需本地 Mac）
# 使用方式：Codemagic 后台连接 GitHub repo overhead-218/moyuquan
# 证书(.p12)和描述文件(.mobileprovision)通过 Codemagic 界面手动上传
#   Settings -> Code signing identities -> iOS certificates / iOS provisioning profiles
# Apple API Key 变量放在 group: appstore_credentials（用于上传 TestFlight）
workflows:
  # ⚠️ 这个 key 必须是 Codemagic 上的【workflow ID】，不是随便起个名字。
  #    Codemagic 用 workflow ID 去匹配 codemagic.yaml 里的 key，
  #    对不上就静默回退到网页端的 Workflow Editor 配置（yaml 完全不生效）。
  #    之前这里写的是 ios-release，而真实 ID 是下面这串 →
  #    结果 platforms / triggering / scripts 等设置全被忽略，
  #    一直按网页端的 [android, ios] 双端配置构建。
  #    查真实 ID：GET https://api.codemagic.io/apps/<appId>
  #               → application.workflows 的 key
  6a8f01c3fa2a91e14a3d1169:
    name: iOS Release
    max_build_duration: 30
    # ⚠️ platforms 已移入 environment（11-27 实测：Codemagic 新版 schema
    #    将 workflow 顶层 platforms 判为 extra fields not permitted，
    #    导致整个 yaml 校验失败 —— 历史注释「必须在 workflow 级」已过时）。
    # ⚠️ 补上 triggering：之前 yaml 里没有这一块，导致 git push 到 main
    #    永远不会自动触发构建（2026-09 就踩过，build 43 push 后排队 10 分钟未动）。
    #    现在 push main 会自动跑 iOS Release workflow。
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
          include: true
    environment:
      platforms:
        - ios
      flutter: stable
      xcode: latest
      vars:
        BUNDLE_ID: com.fishing.fishingApp
        DIST_IDENTITY: "Apple Distribution: Bin Zhong (25UKD3GY5R)"
        DIST_TEAM: "25UKD3GY5R"
        PROFILE_NAME: moyuquan-appstore
        ASC_KEY_ID: PU76AUPJ5N
        ASC_ISSUER: a3ca74de-6ec5-44c5-a865-b5fe775d529c
        ASC_P8: |
          -----BEGIN PRIVATE KEY-----
          MIGTAgEAMBMGByqGSM49AgEGCCqGSM49AwEHBHkwdwIBAQQglYJ++TDH0D19j5md
          sVBtJLGIm6uifG86riTobZbQ8fqgCgYIKoZIzj0DAQehRANCAATdJLxRkLXPXrCe
          6ZRikHFJEgAwp4zp+EbaLYsxBghaq7tbB5cGfQJS/PmI5mDvY7wlG1IQkHmn/tu3
          D14xsTKl
          -----END PRIVATE KEY-----
      ios_signing:
        provisioning_profiles:
          - moyuquan-appstore
        certificates:
          - moyuquan-distribution
    scripts:
      - name: 安装依赖
        script: flutter pub get
      - name: 静态分析
        script: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: 构建 IPA
        script: |
          set -e
          cd $FCI_BUILD_DIR
          echo "=== BUILD HEAD ==="
          git rev-parse HEAD

          # 1) 生成 Flutter iOS 产物（--no-codesign 不签名）
          flutter build ios --release --no-codesign

          # 2) 诊断：列出 profile 名称 + keychain 证书
          echo "=== 诊断: profile / 证书 ==="
          for f in "$HOME/Library/MobileDevice/Provisioning Profiles/"*.mobileprovision; do
            echo "profile: $f"
            security cms -D -i "$f" 2>/dev/null | grep -A1 '<key>Name</key>' | tail -1 | xargs || true
          done
          security find-identity -v -p codesigning 2>/dev/null || true

          # 3) Archive（CODE_SIGNING_ALLOWED=NO 跳过签名，绕过 SPM targets 签名传递问题）
          xcodebuild -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -archivePath build/Runner.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            clean archive

          # 4) 提取 Runner.app
          ARCHIVE_APP="build/Runner.xcarchive/Products/Applications/Runner.app"
          TEMP_APP="build/Runner.app"
          rm -rf "$TEMP_APP"
          cp -R "$ARCHIVE_APP" "$TEMP_APP"
          echo "Runner.app 已提取: $(ls -la "$TEMP_APP")"

          # 5) 嵌入描述文件 + 提取 entitlements + 签名
          #    关键：手动 codesign 不会自动嵌入 mobileprovision，必须手动拷贝成 embedded.mobileprovision，
          #    否则 altool 报 90174 Missing Provisioning Profile
          echo "=== 查找 moyuquan-appstore 描述文件 ==="
          PROFILE_SRC=""
          for f in "$HOME/Library/MobileDevice/Provisioning Profiles/"*.mobileprovision; do
            NAME=$(security cms -D -i "$f" 2>/dev/null | grep -A1 '<key>Name</key>' | tail -1 | sed 's/<[^>]*>//g' | xargs)
            if [ "$NAME" = "moyuquan-appstore" ]; then PROFILE_SRC="$f"; break; fi
          done
          echo "Profile: $PROFILE_SRC"
          cp "$PROFILE_SRC" "$TEMP_APP/embedded.mobileprovision"
          security cms -D -i "$PROFILE_SRC" > /tmp/moyu_profile.plist
          /usr/libexec/PlistBuddy -x -c "Print :Entitlements" /tmp/moyu_profile.plist > /tmp/moyu_entitlements.plist
          echo "=== 开始签名 Runner.app ==="
          # 先逐个签名所有 embedded frameworks（不带 entitlements，避免 90034 Missing or invalid signature）
          find "$TEMP_APP/Frameworks" -name '*.framework' -type d | while read -r fw; do
            echo "signing framework: $fw"
            codesign --force --sign "$DIST_IDENTITY" "$fw"
          done
          # 再签名主 App（带 profile 的 entitlements）
          codesign --force --sign "$DIST_IDENTITY" \
            --entitlements /tmp/moyu_entitlements.plist \
            "$TEMP_APP"
          echo "=== 签名验证 ==="
          codesign --verify -vvvv "$TEMP_APP" 2>&1 | head -20

          # 6) 签名验证
          echo "=== 签名验证 ==="
          codesign --verify -vvvv "$TEMP_APP/Runner" 2>&1 | head -10 || {
            echo "签名验证失败，尝试第二种方式检查"
            ls -la "$TEMP_APP/Runner"
            file "$TEMP_APP/Runner"
          }

          # 7) 打包 IPA（必须符合 Payload/Runner.app/ 结构，
          #    否则 app-store-connect 读取不到 Info.plist 导致上传失败）
          IPA_DIR="$FCI_BUILD_DIR/build/ios/ipa"
          mkdir -p "$IPA_DIR"
          cd "$FCI_BUILD_DIR"
          rm -rf Payload
          mkdir -p Payload
          rm -rf Payload/Runner.app
          cp -R "$TEMP_APP" Payload/Runner.app
          zip -qr "$IPA_DIR/Runner.ipa" Payload
          cd "$FCI_BUILD_DIR"
          echo "=== IPA 生成完成 ==="
          echo "--- 内部结构校验 (首 5 行必须含 Payload/Runner.app/Info.plist) ---"
          unzip -l "$IPA_DIR/Runner.ipa" | head -5
          ls -lh "$IPA_DIR/Runner.ipa"
    artifacts:
      - build/ios/ipa/Runner.ipa
    publishing:
      email:
        recipients:
          - 543675051@qq.com
      app_store_connect:
        api_key: "-----BEGIN PRIVATE KEY-----\nMIGTAgEAMBMGByqGSM49AgEGCCqGSM49AwEHBHkwdwIBAQQglYJ++TDH0D19j5md\nsVBtJLGIm6uifG86riTobZbQ8fqgCgYIKoZIzj0DAQehRANCAATdJLxRkLXPXrCe\n6ZRikHFJEgAwp4zp+EbaLYsxBghaq7tbB5cGfQJS/PmI5mDvY7wlG1IQkHmn/tu3\nD14xsTKl\n-----END PRIVATE KEY-----"
        key_id: PU76AUPJ5N
        issuer_id: a3ca74de-6ec5-44c5-a865-b5fe775d529c
        submit_to_testflight: false
        submit_to_app_store: true

