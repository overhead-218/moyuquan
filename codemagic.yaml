# Codemagic 云构建配置（iOS 上线，无需本地 Mac）
# 使用方式：Codemagic 后台连接 GitHub repo overhead-218/moyuquan
# 证书(.p12)和描述文件(.mobileprovision)通过 Codemagic 界面手动上传
#   Settings -> Code signing identities -> iOS certificates / iOS provisioning profiles
# Apple API Key 变量放在 group: appstore_credentials（用于上传 TestFlight）
workflows:
  ios-release:
    name: iOS Release
    max_build_duration: 30
    environment:
      flutter: stable
      xcode: latest
      vars:
        BUNDLE_ID: com.fishing.fishingApp
      ios_signing:
        provisioning_profiles:
          - moyuquan-appstore
        certificates:
          - moyuquan-distribution
      groups:
        - appstore_credentials
    scripts:
      - name: 安装依赖
        script: flutter pub get
      - name: 静态分析
        script: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: 构建 IPA
        script: |
          cd $FCI_BUILD_DIR
          echo "=== BUILD HEAD ==="
          git rev-parse HEAD
          echo "CM_COMMIT=$CM_COMMIT"
          # 1) 生成 Flutter iOS 产物（--no-codesign 不签名）。
          #    Flutter 可能在此步自动 migrate 升级工程并重置 pbxproj 签名，但我们用命令行强制签名，不受其影响。
          flutter build ios --release --no-codesign
          # 2) 诊断：列出所有已注入 profile 的真实 Name + keychain 证书
          echo "=== 诊断: profile / 证书 ==="
          ls -la "$HOME/Library/MobileDevice/Provisioning Profiles/" 2>/dev/null || true
          for f in "$HOME/Library/MobileDevice/Provisioning Profiles/"*.mobileprovision; do
            echo "-- profile Name:"; security cms -D -i "$f" 2>/dev/null | grep -A1 '<key>Name</key>' | tail -1 | sed 's/<[^>]*>//g' || true
          done
          security find-identity -v -p codesigning 2>/dev/null || true
          # 3) 手动 archive：命令行强制 manual 签名（彻底绕过 Flutter migrate 对 pbxproj 签名的覆盖）
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner \
            -configuration Release \
            -archivePath build/Runner.xcarchive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM=25UKD3GY5R \
            PROVISIONING_PROFILE_SPECIFIER=moyuquan-appstore \
            clean archive
          echo "=== 诊断: archive 产物 ==="
          ls -la build/Runner.xcarchive/Products/Applications/ 2>/dev/null || true
          # 4) 导出 IPA
          xcodebuild -exportArchive \
            -archivePath build/Runner.xcarchive \
            -exportOptionsPlist ios/ExportOptions.plist \
            -exportPath build/ios/ipa
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: false
