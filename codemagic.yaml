# Codemagic 云构建配置（iOS 上线，无需本地 Mac）
# 使用方式：Codemagic 后台连接 GitHub repo overhead-218/moyuquan
# 证书(.p12)和描述文件(.mobileprovision)通过 Codemagic 界面手动上传
#   Settings -> Code signing identities -> iOS certificates / iOS provisioning profiles
# Apple API Key 变量放在 group: appstore_credentials（用于上传 TestFlight）
workflows:
  ios-release:
    name: iOS Release
    max_build_duration: 30
    environment:
      flutter: stable
      xcode: latest
      vars:
        BUNDLE_ID: com.fishing.fishingApp
        DIST_IDENTITY: "Apple Distribution: Bin Zhong (25UKD3GY5R)"
        DIST_TEAM: "25UKD3GY5R"
        PROFILE_NAME: moyuquan-appstore
      ios_signing:
        provisioning_profiles:
          - moyuquan-appstore
        certificates:
          - moyuquan-distribution
      groups:
        - appstore_credentials
    scripts:
      - name: 安装依赖
        script: flutter pub get
      - name: 静态分析
        script: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: 构建 IPA
        script: |
          set -e
          cd $FCI_BUILD_DIR
          echo "=== BUILD HEAD ==="
          git rev-parse HEAD

          # 1) 生成 Flutter iOS 产物（--no-codesign 不签名）
          flutter build ios --release --no-codesign

          # 2) 诊断：列出 profile 名称 + keychain 证书
          echo "=== 诊断: profile / 证书 ==="
          for f in "$HOME/Library/MobileDevice/Provisioning Profiles/"*.mobileprovision; do
            echo "profile: $f"
            security cms -D -i "$f" 2>/dev/null | grep -A1 '<key>Name</key>' | tail -1 | xargs || true
          done
          security find-identity -v -p codesigning 2>/dev/null || true

          # 3) Archive（CODE_SIGNING_ALLOWED=NO 跳过签名，绕过 SPM targets 签名传递问题）
          xcodebuild -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -archivePath build/Runner.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            clean archive

          # 4) 提取 Runner.app
          ARCHIVE_APP="build/Runner.xcarchive/Products/Applications/Runner.app"
          TEMP_APP="build/Runner.app"
          rm -rf "$TEMP_APP"
          cp -R "$ARCHIVE_APP" "$TEMP_APP"
          echo "Runner.app 已提取: $(ls -la "$TEMP_APP")"

          # 5) 签名（--deep 递归签所有二进制；App Store 分发不需要手动 entitlements，
          #    profile 已内置，codesign 自动嵌入）
          echo "=== 开始签名 Runner.app ==="
          codesign --force --deep \
            --sign "$DIST_IDENTITY" \
            "$TEMP_APP"

          # 6) 签名验证
          echo "=== 签名验证 ==="
          codesign --verify -vvvv "$TEMP_APP/Runner" 2>&1 | head -10 || {
            echo "签名验证失败，尝试第二种方式检查"
            ls -la "$TEMP_APP/Runner"
            file "$TEMP_APP/Runner"
          }

          # 7) 打包 IPA（手动 zip 打包，符合 App Store 上传要求）
          mkdir -p build/ios/ipa
          (cd "$TEMP_APP/.." && zip -qr build/ios/ipa/Runner.ipa Runner.app)
          echo "=== IPA 生成完成 ==="
          ls -lh build/ios/ipa/Runner.ipa
