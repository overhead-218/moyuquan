# Codemagic 云构建配置（iOS 上线，无需本地 Mac）
# 使用方式：Codemagic 后台连接 GitHub repo overhead-218/moyuquan
# 证书(.p12)和描述文件(.mobileprovision)通过 Codemagic 界面手动上传
#   Settings -> Code signing identities -> iOS certificates / iOS provisioning profiles
# Apple API Key 变量放在 group: appstore_credentials（用于上传 TestFlight）
workflows:
  ios-release:
    name: iOS Release
    max_build_duration: 30
    environment:
      flutter: stable
      xcode: latest
      vars:
        BUNDLE_ID: com.fishing.fishingApp
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.fishing.fishingApp
        provisioning_profiles:
          - moyuquan-appstore
        certificates:
          - moyuquan-distribution
      groups:
        - appstore_credentials
    scripts:
      - name: 安装依赖
        script: flutter pub get
      - name: 静态分析
        script: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: 构建 IPA
        script: flutter build ipa --release --export-options-plist=$CM_EXPORT_OPTIONS_PATH
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: false
