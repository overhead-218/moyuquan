# Codemagic 云构建配置（iOS 上线，无需本地 Mac）
# 使用方式：Codemagic 后台连接 GitHub repo overhead-218/moyuquan
# 证书(.p12)和描述文件(.mobileprovision)通过 Codemagic 界面手动上传
#   Settings -> Code signing identities -> iOS certificates / iOS provisioning profiles
# Apple API Key 变量放在 group: appstore_credentials（用于上传 TestFlight）
workflows:
  ios-release:
    name: iOS Release
    max_build_duration: 30
    environment:
      flutter: stable
      xcode: latest
      vars:
        BUNDLE_ID: com.fishing.fishingApp
      ios_signing:
        provisioning_profiles:
          - moyuquan-appstore
        certificates:
          - moyuquan-distribution
      groups:
        - appstore_credentials
    scripts:
      - name: 安装依赖
        script: flutter pub get
      - name: 静态分析
        script: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: 构建 IPA
        script: |
          cd $FCI_BUILD_DIR
          # 关键：提前升级 iOS 工程到当前 Flutter SDK 版本。
          # 否则 flutter build 会在 archive 阶段自动 migrate 把手动签名配置覆盖回 Automatic，
          # 导致一直报 No development certificates。
          flutter create --platforms=ios .
          # migrate 后 pbxproj 已重置为 Automatic，重新注入 manual 签名 + 发布证书 + profile
          node fix_ios_signing.js
          echo "=== 诊断 ==="
          echo "bundle id:"; grep PRODUCT_BUNDLE_IDENTIFIER ios/Runner.xcodeproj/project.pbxproj | head -1
          env | grep -i CM_ || true
          flutter build ipa --release --export-options-plist=ios/ExportOptions.plist
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: false
